name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: renotas-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar descarga directa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Renotas.apk
          gh release create "apk-${{ github.run_number }}" Renotas.apk \
            --title "Renotas (APK ${{ github.run_number }})" \
            --notes "APK para instalar en Android." \
            --latest
