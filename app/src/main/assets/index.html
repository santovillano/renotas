<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Renotas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: cabecera con logo, inicio con tarjeta de resumen y 4 mosaicos de color, paneles por sección y barra de 6 pestañas abajo; splash animado al abrir */
:root{
  --bg:#F5F3FC; --surface:#FFFFFF; --surface2:#ECE8FA; --fg:#1E1740; --muted:#675F8C;
  --line:#E0DBF3; --accent:#6246E8; --accent-fg:#FFFFFF; --warn:#B0610A; --danger:#C42B4F; --ok:#1E8E6B;
  --g1:#6C4DF6; --g2:#E8467B; --pink:#E8467B;
  --font-display:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120E24; --surface:#1C1736; --surface2:#271F48; --fg:#EDE9FF; --muted:#A59FCB;
    --line:#35295E; --accent:#9B86FF; --accent-fg:#120E24; --warn:#E8A94F; --danger:#FF7A9C; --ok:#5FD6AE;
    --g1:#7A5CFF; --g2:#E8467B; --pink:#FF6F9C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120E24; --surface:#1C1736; --surface2:#271F48; --fg:#EDE9FF; --muted:#A59FCB;
  --line:#35295E; --accent:#9B86FF; --accent-fg:#120E24; --warn:#E8A94F; --danger:#FF7A9C; --ok:#5FD6AE;
  --g1:#7A5CFF; --g2:#E8467B; --pink:#FF6F9C;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:15px; line-height:1.45;
  padding-block:20px 110px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:560px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo-sm{width:46px;height:46px;border-radius:12px;flex:none;box-shadow:0 3px 10px rgba(108,77,246,.35)}
.ttl{display:flex;flex-direction:column;min-width:0}
.date{font-size:13px;color:var(--muted);letter-spacing:.02em}
h1{font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1.1;margin:0;text-wrap:balance}

.hero{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:22px;padding:18px 18px 20px;margin-bottom:14px;
  box-shadow:0 10px 24px rgba(108,77,246,.28)}
.hero-k{margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.sum{margin:0;font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1.15;text-wrap:balance;font-variant-numeric:tabular-nums}
.sum-sub{margin:6px 0 0;font-size:14px;opacity:.92}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;border-radius:20px;padding:14px;min-height:112px;color:#fff;text-align:left;cursor:pointer}
.tile svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;margin-bottom:auto}
.tile b{font-family:var(--font-display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:13.5px;font-weight:700;opacity:.95}
.t1{background:#16877A}.t2{background:#6246E8}.t3{background:#2279C4}.t4{background:#D93A69}

.example{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:16px;font-size:13px}
.example p{margin:0;min-width:0;flex:1 1 200px}

.panel[hidden]{display:none}
.add{display:flex;flex-wrap:wrap;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:18px}
.add .grow{flex:1 1 100%;min-width:0}
.add .half{flex:1 1 130px;min-width:0}
input[type=text],input[type=date],input[type=time],select,textarea{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px;min-height:44px}
textarea{resize:vertical;min-height:96px}
input::placeholder,textarea::placeholder{color:var(--muted)}
.btn{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:800;min-height:44px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:700}
.btn.small{min-height:36px;padding:6px 12px;font-size:13px}
.add .btn{flex:1 1 100%}

.grp{display:flex;align-items:center;gap:8px;margin:20px 0 8px;font-family:var(--font-display);font-size:13px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.grp .n{font-family:var(--font-body);font-weight:600;font-variant-numeric:tabular-nums;background:var(--surface2);border-radius:99px;padding:1px 8px;font-size:12px}
.grp.late{color:var(--danger)}
.grp.now{color:var(--accent)}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 10px}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.item .t{overflow-wrap:anywhere}
.item .m{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .m.late{color:var(--danger);font-weight:500}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;color:transparent;padding:0}
.chk svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.item.done .chk{background:var(--g1);border-color:var(--g1);color:#fff}
.icon-btn{flex:none;width:36px;height:36px;border:0;background:transparent;border-radius:8px;color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.icon-btn:hover{color:var(--danger)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip{flex:none;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 8px;border:1px solid currentColor;letter-spacing:.02em}
.chip.alta{color:var(--danger)} .chip.media{color:var(--warn)} .chip.baja{color:var(--muted)}
.qty{flex:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px;padding:18px 4px;text-align:center}

.progress{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g1),var(--g2));border-radius:99px;transition:width .25s}
.bulk{display:flex;justify-content:flex-end;margin-top:14px}

.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 8px;display:flex;flex-direction:column;gap:6px}
.note h3{margin:0;font-family:var(--font-display);font-size:16px;overflow-wrap:anywhere}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
.note .acts{display:flex;justify-content:flex-end;gap:2px}
.notes{display:flex;flex-direction:column;gap:10px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:0}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;border:0;border-radius:8px;
  padding:6px 0;color:var(--muted);font-size:10.5px;font-weight:700;cursor:pointer;min-height:48px;min-width:0}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent);font-weight:600}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:-7px;left:25%;right:25%;height:2px;background:var(--accent);border-radius:2px}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:99px;background:var(--g2);color:#fff;
  font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-variant-numeric:tabular-nums}
.badge[hidden]{display:none}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;
  width:calc(100% - 32px);max-width:420px;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
#toast[hidden]{display:none}
#toast span{min-width:0;overflow-wrap:anywhere}
#toast button{background:transparent;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:6px;min-height:32px}
/* Ideas y micrófono */
.idea-field{position:relative}
.idea-field textarea{min-height:140px;padding-right:64px}
.mic{position:absolute;right:8px;bottom:8px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
  color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
.mic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.mic.on{background:var(--danger);border-color:var(--danger);color:var(--bg);animation:pulse 1.4s ease-out infinite}
.mic-hint,.partial{flex:1 1 100%;margin:0;font-size:13px;color:var(--muted)}
.partial{font-style:italic;color:var(--fg)}
.note .m{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.note .acts{align-items:center}

/* Burbuja flotante lateral y ventana de pendientes */
#fab{position:fixed;z-index:25;width:54px;height:54px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;
  display:grid;place-items:center;cursor:grab;padding:0;touch-action:none;user-select:none;-webkit-user-select:none;
  box-shadow:0 4px 14px rgba(0,0,0,.28)}
#fab.ok{background:var(--ok)}
#fab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#fab .cnt{position:absolute;top:-5px;right:-5px;min-width:22px;height:22px;border-radius:99px;background:var(--danger);color:var(--bg);
  font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg);
  font-variant-numeric:tabular-nums;pointer-events:none}
#fab .cnt[hidden]{display:none}
#fab.alert{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(200,70,50,.55),0 4px 14px rgba(0,0,0,.28)}
  70%{box-shadow:0 0 0 16px rgba(200,70,50,0),0 4px 14px rgba(0,0,0,.28)}
  100%{box-shadow:0 0 0 0 rgba(200,70,50,0),0 4px 14px rgba(0,0,0,.28)}
}
#float{position:fixed;z-index:26;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100% - 32px));
  max-height:min(70vh,520px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.3)}
#float[hidden]{display:none}
#float.r{right:max(16px,env(safe-area-inset-right,0px))}
#float.l{left:max(16px,env(safe-area-inset-left,0px))}
.fl-head{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 8px 14px;border-bottom:1px solid var(--line)}
.fl-head h2{margin:0;font-family:var(--font-display);font-size:17px}
.fl-body{overflow-y:auto;padding:2px 10px 12px;min-height:0}
.fl-body .grp{margin:14px 0 6px}
.fl-body .item{padding:6px 6px 6px 8px}
.fl-body .more{margin:8px 0 0}
.fl-sub{display:block;font-size:12.5px;color:var(--muted)}
.fl-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.fl-foot select{width:auto;min-height:36px;padding:4px 8px;font-size:14px}
/* Pantalla de inicio animada */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#4F34D8 0%,#A23DB0 55%,#EC4A7A 100%);cursor:pointer;
  transition:opacity .5s ease,visibility .5s ease;animation:splashOut .5s ease 3.4s forwards}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
@keyframes splashOut{to{opacity:0;visibility:hidden;pointer-events:none}}
.sp-glow{position:absolute;width:min(70vw,340px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),rgba(255,255,255,0) 68%);
  animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{transform:scale(.85);opacity:.55}50%{transform:scale(1.15);opacity:1}}
.sp-logo{position:relative;width:min(48vw,230px);height:auto;max-width:100%;filter:drop-shadow(0 18px 28px rgba(20,0,60,.45));
  animation:pop .95s cubic-bezier(.2,1.25,.35,1) both,bob 3s ease-in-out .95s infinite}
@keyframes pop{0%{transform:scale(.25) rotate(-14deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.sp-by{position:absolute;left:0;right:0;text-align:center;bottom:calc(40px + env(safe-area-inset-bottom,0px));margin:0;color:#fff;font-size:16px;
  letter-spacing:.05em;opacity:0;animation:rise .9s ease 1.1s forwards}
.sp-by b{font-weight:800}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .bar i{transition:none}#fab.alert,.mic.on{animation:none}
  .sp-glow,.sp-logo{animation:none}.sp-by{animation:none;opacity:1}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <img id="logo-sm" class="logo-sm" alt="" width="46" height="46">
    <div class="ttl"><h1>Renotas</h1><span class="date" id="date"></span></div>
  </header>

  <div class="example" id="example" hidden>
    <p>Estás viendo datos de ejemplo para probar la app. Bórralos cuando quieras empezar con los tuyos.</p>
    <button class="btn ghost small" type="button" data-clear-example>Borrar ejemplos</button>
  </div>

  <section class="panel" id="p-inicio" aria-labelledby="t-inicio">
    <div class="hero">
      <p class="hero-k">Tu resumen de hoy</p>
      <p class="sum" id="sum"></p>
      <p class="sum-sub" id="sum-sub"></p>
    </div>
    <div class="tiles">
      <button class="tile t1" type="button" data-tab="recordatorios">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15z"/><path d="M10 21h4"/></svg>
        <b id="h-rem">0</b><span>Recordatorios de hoy</span></button>
      <button class="tile t2" type="button" data-tab="tareas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>
        <b id="h-task">0</b><span>Tareas pendientes</span></button>
      <button class="tile t3" type="button" data-tab="compras">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.5l2 11h10l2-8H7"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>
        <b id="h-shop">0</b><span>Por comprar</span></button>
      <button class="tile t4" type="button" data-tab="ideas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
        <b id="h-idea">0</b><span>Ideas guardadas</span></button>
    </div>
    <div id="l-home"></div>
  </section>

  <section class="panel" id="p-recordatorios" aria-labelledby="t-recordatorios" hidden>
    <form class="add" id="f-rem" autocomplete="off">
      <div class="grow"><input type="text" id="r-text" placeholder="¿Qué quieres recordar?" aria-label="Texto del recordatorio" maxlength="140"></div>
      <div class="half"><input type="date" id="r-date" aria-label="Fecha"></div>
      <div class="half"><input type="time" id="r-time" aria-label="Hora"></div>
      <button class="btn" type="submit">Agregar recordatorio</button>
    </form>
    <div id="l-rem"></div>
  </section>

  <section class="panel" id="p-tareas" aria-labelledby="t-tareas" hidden>
    <form class="add" id="f-task" autocomplete="off">
      <div class="grow"><input type="text" id="k-text" placeholder="Nueva tarea" aria-label="Texto de la tarea" maxlength="140"></div>
      <div class="half"><select id="k-prio" aria-label="Prioridad">
        <option value="alta">Prioridad alta</option><option value="media" selected>Prioridad media</option><option value="baja">Prioridad baja</option>
      </select></div>
      <button class="btn" type="submit">Agregar tarea</button>
    </form>
    <div id="l-task"></div>
  </section>

  <section class="panel" id="p-compras" aria-labelledby="t-compras" hidden>
    <form class="add" id="f-shop" autocomplete="off">
      <div class="grow"><input type="text" id="s-text" placeholder="Producto" aria-label="Producto" maxlength="80"></div>
      <div class="half"><input type="text" id="s-qty" placeholder="Cantidad (ej. 2 kg)" aria-label="Cantidad" maxlength="20"></div>
      <div class="half"><select id="s-cat" aria-label="Sección del supermercado"></select></div>
      <button class="btn" type="submit">Agregar a la lista</button>
    </form>
    <div id="l-shop"></div>
  </section>

  <section class="panel" id="p-notas" aria-labelledby="t-notas" hidden>
    <form class="add" id="f-note" autocomplete="off">
      <div class="grow"><input type="text" id="n-title" placeholder="Título de la nota" aria-label="Título" maxlength="80"></div>
      <div class="grow"><textarea id="n-body" placeholder="Escribe lo que quieras guardar" aria-label="Contenido" maxlength="2000"></textarea></div>
      <button class="btn" type="submit" id="n-save">Guardar nota</button>
      <button class="btn ghost" type="button" id="n-cancel" hidden>Cancelar edición</button>
    </form>
    <div id="l-note"></div>
  </section>

  <section class="panel" id="p-ideas" aria-labelledby="t-ideas" hidden>
    <form class="add" id="f-idea" autocomplete="off">
      <div class="grow idea-field">
        <textarea id="i-text" placeholder="Escribe tu idea o toca el micrófono y dila en voz alta" aria-label="Idea" maxlength="2000"></textarea>
        <button class="mic" type="button" id="mic" aria-pressed="false" aria-label="Dictar con el micrófono" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg>
        </button>
      </div>
      <p class="partial" id="partial" hidden></p>
      <p class="mic-hint" id="mic-hint" hidden></p>
      <button class="btn" type="submit">Guardar idea</button>
    </form>
    <div id="l-idea"></div>
  </section>
</div>

<button id="fab" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="float" aria-label="Pendientes">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15z"/><path d="M10 21h4"/></svg>
  <span class="cnt" id="fab-cnt" hidden></span>
</button>
<div id="float" class="r" role="dialog" aria-label="Pendientes" hidden>
  <div class="fl-head">
    <div><h2>Pendientes</h2><span class="fl-sub" id="fl-sub"></span></div>
    <button class="icon-btn" type="button" id="fl-close" aria-label="Cerrar ventana"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="fl-body" id="fl-body"></div>
  <div class="fl-foot">
    <label for="fl-every">Avisarme cada</label>

<script>
(function(){
  var KEY='mis-pendientes-v1';
  var TABS=['inicio','recordatorios','tareas','compras','notas','ideas'];
  var CATS=['Frutas y verduras','Panadería','Lácteos','Carnes','Despensa','Limpieza','Otros'];

  var TRASH='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg>';

  function $(s){return document.querySelector(s)}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function p2(n){return String(n).padStart(2,'0')}
  function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
  function inDays(n){var d=new Date();d.setDate(d.getDate()+n);return ymd(d)}
  function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
  function short(s){s=String(s||'');return s.length>32?s.slice(0,30)+'…':s}

  function seed(){
    return {example:true,
      ideas:[
        {id:uid(),text:'Pintar la pieza de un color más claro y cambiar las cortinas.',at:new Date(Date.now()-5*36e5).toISOString()},

      ],
      rem:[
        {id:uid(),text:'Pagar la cuenta de la luz',date:inDays(-1),time:'18:00',done:false},
        {id:uid(),text:'Retirar encargo en Correos',date:inDays(0),time:'12:00',done:false},
        {id:uid(),text:'Llamar al dentista',date:inDays(0),time:'17:30',done:false},
        {id:uid(),text:'Cumpleaños de la tía Marta',date:inDays(3),time:'',done:false},

        {id:uid(),text:'Revisar la presión de los neumáticos',date:'',time:'',done:false}
      ],

        {id:uid(),text:'Cambiar la ampolleta del pasillo',prio:'media',done:false},
        {id:uid(),text:'Ordenar el cajón de herramientas',prio:'baja',done:false},
        {id:uid(),text:'Lavar el auto',prio:'baja',done:true}
      ],
      shop:[
        {id:uid(),text:'Paltas',qty:'4 un',cat:'Frutas y verduras',done:false},
        {id:uid(),text:'Tomates',qty:'1 kg',cat:'Frutas y verduras',done:true},
        {id:uid(),text:'Marraquetas',qty:'6 un',cat:'Panadería',done:false},
        {id:uid(),text:'Leche',qty:'2 l',cat:'Lácteos',done:false},
        {id:uid(),text:'Queso mantecoso',qty:'300 g',cat:'Lácteos',done:false},
        {id:uid(),text:'Pollo',qty:'1 kg',cat:'Carnes',done:false},
        {id:uid(),text:'Arroz',qty:'1 kg',cat:'Despensa',done:false},

      ]};
  }
  function load(){
    try{var r=localStorage.getItem(KEY);if(r){var s=JSON.parse(r);if(s&&s.rem&&s.tasks&&s.shop&&s.notes){if(!s.ideas)s.ideas=s.example?seed().ideas:[];return s}}}catch(e){}
    return seed();
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}syncNative()}
  function syncNative(){
    try{
      if(window.Android&&Android.syncReminders){
        var list=state.rem.filter(function(r){return !r.done&&r.date}).map(function(r){
          return {id:r.id,text:r.text,at:new Date(r.date+'T'+(r.time||'08:00')).getTime()};
        });
        Android.syncReminders(JSON.stringify(list));
      }
    }catch(e){}

  function toast(msg,canUndo){

  /* ---------- Recordatorios ---------- */
  function dlabel(r,today){
    if(!r.date)return '';
    var d=new Date(r.date+'T00:00'),t0=new Date(today+'T00:00');
    var diff=Math.round((d-t0)/864e5),l;
    if(diff===0)l='Hoy';else if(diff===1)l='Mañana';else if(diff===-1)l='Ayer';
    else l=cap(d.toLocaleDateString('es-CL',{weekday:'short',day:'numeric',month:'short'}).replace('.',''));
    return l+(r.time?' · '+r.time:'');
  }
  function remGroups(){
    var now=new Date(),today=ymd(now),g={venc:[],hoy:[],prox:[],sin:[],hechos:[]};
    state.rem.forEach(function(r){
      if(r.done)g.hechos.push(r);
      else if(!r.date)g.sin.push(r);
      else if(new Date(r.date+'T'+(r.time||'23:59'))<now)g.venc.push(r);
      else if(r.date===today)g.hoy.push(r);
      else g.prox.push(r);
    });
    var key=function(r){return (r.date||'')+' '+(r.time||'')};
    ['venc','hoy','prox','hechos'].forEach(function(k){g[k].sort(function(a,b){return key(a)<key(b)?-1:1})});
    return {g:g,today:today};
  }
  function remItem(r,today,late){
    return '<li class="item'+(r.done?' done':'')+'" data-id="'+r.id+'">'+
      '<button class="chk" type="button" data-act="toggle" aria-label="'+(r.done?'Marcar como pendiente':'Marcar como hecho')+'">'+CHK+'</button>'+
      '<div class="txt"><span class="t">'+esc(r.text)+'</span>'+(r.date?'<span class="m'+(late?' late':'')+'">'+(late?'Vencido · ':'')+esc(dlabel(r,today))+'</span>':'')+'</div>'+
      '<button class="icon-btn" type="button" data-act="del" aria-label="Eliminar recordatorio">'+TRASH+'</button></li>';
  }
  function renderRem(){
    var o=remGroups(),g=o.g,today=o.today,h='';

      if(!arr.length)return '';
      return '<h2 class="grp '+cls+'">'+title+'<span class="n">'+arr.length+'</span></h2><ul class="list">'+arr.map(function(r){return remItem(r,today,late)}).join('')+'</ul>';
    }
    h+=grp('Vencidos',g.venc,'late',true);
    h+=grp('Hoy',g.hoy,'now',false);
    h+=grp('Próximos',g.prox,'',false);

  function show(tab){
    if(TABS.indexOf(tab)<0)tab='inicio';

      $('#p-'+t).hidden=(t!==tab);
      $('#t-'+t).setAttribute('aria-selected',t===tab?'true':'false');

  /* ---------- Eventos ---------- */
  function bind(el,key){
    el.addEventListener('click',function(e){
      var b=e.target.closest('[data-act]');if(!b)return;
      var li=b.closest('[data-id]');if(!li)return;
      var arr=state[key],i=-1;
      for(var k=0;k<arr.length;k++){if(arr[k].id===li.dataset.id){i=k;break}}
      if(i<0)return;
      var act=b.dataset.act;
      if(act==='totask'){
        snap();var it=arr.splice(i,1)[0],tx=String(it.text).replace(/\s+/g,' ').trim();
        state.tasks.push({id:uid(),text:tx.length>140?tx.slice(0,137)+'…':tx,prio:'media',done:false});
        commit();toast('La idea pasó a Tareas',true);
      }
      else if(act==='toggle'){arr[i].done=!arr[i].done;commit()}
      else if(act==='del'){snap();var rm=arr.splice(i,1)[0];if(editingNote===rm.id)endEdit();commit();toast('Eliminado: '+short(rm.text||rm.title),true)}
      else if(act==='edit'){
        editingNote=arr[i].id;$('#n-title').value=arr[i].title||'';$('#n-body').value=arr[i].body||'';
        $('#n-save').textContent='Guardar cambios';$('#n-cancel').hidden=false;$('#n-title').focus();
        window.scrollTo({top:0,behavior:'smooth'});
      }
    });
  }
  bind($('#l-rem'),'rem');bind($('#l-home'),'rem');bind($('#l-task'),'tasks');bind($('#l-shop'),'shop');bind($('#l-note'),'notes');bind($('#l-idea'),'ideas');

  function endEdit(){editingNote=null;$('#f-note').reset();$('#n-save').textContent='Guardar nota';$('#n-cancel').hidden=true}
  $('#n-cancel').addEventListener('click',endEdit);

  $('#f-rem').addEventListener('submit',function(e){
    e.preventDefault();var t=$('#r-text').value.trim();if(!t){$('#r-text').focus();return}
    state.rem.push({id:uid(),text:t,date:$('#r-date').value,time:$('#r-time').value,done:false});
    this.reset();commit();$('#r-text').focus();
  });
  $('#f-task').addEventListener('submit',function(e){
    e.preventDefault();var t=$('#k-text').value.trim();if(!t){$('#k-text').focus();return}
    state.tasks.push({id:uid(),text:t,prio:$('#k-prio').value,done:false});
    $('#k-text').value='';commit();$('#k-text').focus();
  });
  $('#f-shop').addEventListener('submit',function(e){

    state.shop.push({id:uid(),text:t,qty:$('#s-qty').value.trim(),cat:$('#s-cat').value,done:false});
    $('#s-text').value='';$('#s-qty').value='';commit();$('#s-text').focus();

  $('#f-note').addEventListener('submit',function(e){

    if(!ti&&!bo){$('#n-title').focus();return}

    }else{state.notes.unshift({id:uid(),title:ti,body:bo})}

  document.addEventListener('click',function(e){
    var tab=e.target.closest('[data-tab]');
    if(tab){location.hash=tab.dataset.tab;show(tab.dataset.tab);return}
    var bulk=e.target.closest('[data-bulk]');

      var k=bulk.dataset.bulk,key=k==='rem'?'rem':k,n;
      snap();n=state[key].filter(function(x){return x.done}).length;

      commit();toast('Se quitaron '+n+(k==='shop'?' comprados':k==='rem'?' recordatorios hechos':' tareas hechas'),true);return;
    }

      snap();state={example:false,rem:[],tasks:[],shop:[],notes:[],ideas:[]};commit();toast('Ejemplos borrados',true);return;

  /* ---------- Ideas y dictado por voz ---------- */
  var dict=null,dictLang={language:'es'},micBtn=$('#mic'),ideaTa=$('#i-text'),micHint=$('#mic-hint'),partialEl=$('#partial');
  function hint(msg){micHint.textContent=msg||'';micHint.hidden=!msg}
  function setPartial(t){partialEl.textContent=t||'';partialEl.hidden=!t}
  function micOn(on){
    micBtn.classList.toggle('on',on);
    micBtn.setAttribute('aria-pressed',on?'true':'false');
    micBtn.setAttribute('aria-label',on?'Detener dictado':'Dictar con el micrófono');
  }
  var nativeSpeech=false;
  try{nativeSpeech=!!(window.Android&&Android.hasSpeech&&Android.hasSpeech())}catch(e){}
  if(nativeSpeech){
    var nAct=false;
    dict={active:function(){return nAct},
      start:function(){try{Android.startSpeech('es-CL')}catch(e){}return Promise.resolve()},
      stop:function(){try{Android.stopSpeech()}catch(e){}return Promise.resolve()}};
    micBtn.hidden=false;
    window.onNativeSpeech=function(t,fin){
      if(fin){var v=ideaTa.value;ideaTa.value=v+(v&&!/\s$/.test(v)?' ':'')+t;setPartial('')}
      else setPartial(t);
    };
    window.onNativeSpeechState=function(st){
      nAct=(st==='listening');micOn(nAct);
      if(st!=='listening')setPartial('');
      if(st==='denied')hint('Permite el micrófono para Renotas en los ajustes del teléfono.');
      else if(st==='unavailable')hint('Este teléfono no tiene reconocimiento de voz disponible. Escribe con el teclado.');
      else if(st==='error')hint('No se pudo usar el micrófono. Intenta de nuevo.');
    };
  }else if(window.claude&&typeof window.claude.use==='function'){
    window.claude.use('dictation').then(function(d){
      if(!d){hint('El dictado por voz no está disponible en este navegador. Escribe la idea con el teclado.');return}
      dict=d;micBtn.hidden=false;
      d.onPartial(function(e){setPartial(e.text)});
      d.onFinal(function(e){
        var v=e.text||'';
        if(!ideaTa.value)v=v.replace(/^\s+/,'');
        ideaTa.value+=v;setPartial('');
      });
      d.onState(function(e){
        micOn(e.state==='starting'||e.state==='listening');
        if(e.state==='idle'){
          setPartial('');
          if(e.reason==='not_granted')hint('El micrófono está bloqueado para esta página. Escribe con el teclado.');
          else if(e.reason==='rate_limited')hint('Hay demasiados dictados a la vez. Intenta de nuevo en unos segundos.');
          else if(e.reason==='upstream_error')hint('No se pudo usar el micrófono. Intenta de nuevo.');
          else if(e.reason==='time_limit')hint('El dictado se detuvo por el límite de tiempo.');
        }
      });
    }).catch(function(){});
  }
  micBtn.addEventListener('click',function(){
    if(!dict)return;
    hint('');
    if(dict.active()){dict.stop().catch(function(){});return}
    dict.start(dictLang).catch(function(err){
      var c=err&&err.code;
      if(c==='unavailable'&&dictLang){dictLang=undefined;hint('El dictado en español no está disponible. Toca el micrófono otra vez para dictar en el idioma del navegador.')}
      else if(c==='unavailable')hint('El dictado no está disponible para tu cuenta. Escribe con el teclado.');
      else if(c==='not_granted')hint('Dijiste que no al micrófono. Escribe con el teclado o cambia el permiso en el menú Permisos de esta página.');
    });
  });
  $('#f-idea').addEventListener('submit',function(e){

    function go(){

    }
    if(dict&&dict.active()){dict.stop().then(go,go)}else go();
  });

  /* ---------- Burbuja flotante y ventana de pendientes ---------- */
  var fab=$('#fab'),panel=$('#float'),FKEY='mis-pendientes-fab',pos={side:'r',y:.55},floatOpen=false,drag=null;
  try{var sp=JSON.parse(localStorage.getItem(FKEY));if(sp&&(sp.side==='l'||sp.side==='r')&&typeof sp.y==='number')pos=sp}catch(e){}
  function savePos(){try{localStorage.setItem(FKEY,JSON.stringify(pos))}catch(e){}}
  function clampY(y){return Math.max(70,Math.min(y,window.innerHeight-150))}
  function place(){
    fab.style.top=clampY(pos.y*window.innerHeight)+'px';
    if(pos.side==='l'){fab.style.right='auto';fab.style.left='max(8px,env(safe-area-inset-left,0px))'}
    else{fab.style.left='auto';fab.style.right='max(8px,env(safe-area-inset-right,0px))'}
    panel.className=pos.side;
  }
  function toggleFloat(force){
    floatOpen=typeof force==='boolean'?force:!floatOpen;
    panel.hidden=!floatOpen;
    fab.setAttribute('aria-expanded',floatOpen?'true':'false');
    if(floatOpen)renderFloat();
  }
  function fItem(kind,x,meta,late,chip){
    return '<li class="item" data-fk="'+kind+'" data-fid="'+x.id+'">'+
      '<button class="chk" type="button" data-fact="1" aria-label="Marcar como hecho">'+CHK+'</button>'+
      '<div class="txt"><span class="t">'+esc(x.text)+'</span>'+(meta?'<span class="m'+(late?' late':'')+'">'+esc(meta)+'</span>':'')+'</div>'+(chip||'')+'</li>';
  }
  function renderFloat(){
    var o=remGroups(),g=o.g,today=o.today,rems=g.venc.concat(g.hoy);
    var tasks=state.tasks.filter(function(t){return !t.done}).sort(function(a,b){return PR[a.prio]-PR[b.prio]});
    var shopN=state.shop.filter(function(s){return !s.done}).length;
    var n=rems.length+tasks.length,h='';
    var cnt=$('#fab-cnt');cnt.textContent=n>99?'99+':n;cnt.hidden=!n;
    $('#fl-sub').textContent=n?('Tienes '+n+(n===1?' pendiente':' pendientes')+(g.venc.length?' · '+g.venc.length+(g.venc.length===1?' vencido':' vencidos'):'')):'Todo al día';
    fab.classList.toggle('alert',g.venc.length>0);
    fab.classList.toggle('ok',n===0);
    fab.setAttribute('aria-label','Pendientes: '+n+(g.venc.length?'. Hay recordatorios vencidos':''));
    if(!n){h='<p class="empty">Todo al día. No tienes pendientes.</p>'}
    else{
      if(rems.length){
        h+='<h2 class="grp '+(g.venc.length?'late':'now')+'">Recordatorios<span class="n">'+rems.length+'</span></h2><ul class="list">'+
          rems.map(function(r){var late=g.venc.indexOf(r)>=0;return fItem('rem',r,(late?'Vencido · ':'')+dlabel(r,today),late)}).join('')+'</ul>';
      }
      if(tasks.length){
        h+='<h2 class="grp">Tareas<span class="n">'+tasks.length+'</span></h2><ul class="list">'+
          tasks.slice(0,6).map(function(t){return fItem('tasks',t,'',false,'<span class="chip '+t.prio+'">'+PL[t.prio]+'</span>')}).join('')+'</ul>';
        if(tasks.length>6)h+='<p class="more"><button class="btn ghost small" type="button" data-tab="tareas">Ver las '+(tasks.length-6)+' restantes</button></p>';
      }
    }
    if(shopN)h+='<div class="bulk"><button class="btn ghost small" type="button" data-tab="compras">'+shopN+' por comprar</button></div>';
    $('#fl-body').innerHTML=h;
  }
  fab.addEventListener('pointerdown',function(e){
    var r=fab.getBoundingClientRect();
    drag={sx:e.clientX,sy:e.clientY,ox:r.left,oy:r.top,moved:false};
    try{fab.setPointerCapture(e.pointerId)}catch(err){}
  });
  fab.addEventListener('pointermove',function(e){
    if(!drag)return;
    var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(!drag.moved&&Math.hypot(dx,dy)<6)return;
    drag.moved=true;
    fab.style.right='auto';fab.style.left=(drag.ox+dx)+'px';fab.style.top=clampY(drag.oy+dy)+'px';
  });
  fab.addEventListener('pointerup',function(){
    if(!drag)return;
    var d=drag;drag=null;
    if(d.moved){
      var r=fab.getBoundingClientRect();
      pos.side=(r.left+r.width/2)<window.innerWidth/2?'l':'r';
      pos.y=clampY(r.top)/window.innerHeight;
      savePos();place();
    }else{toggleFloat()}
  });
  fab.addEventListener('pointercancel',function(){drag=null;place()});
  fab.addEventListener('click',function(e){if(e.detail===0)toggleFloat()});
  $('#fl-close').addEventListener('click',function(){toggleFloat(false);fab.focus()});
  panel.addEventListener('click',function(e){
    var b=e.target.closest('[data-fact]');
    if(b){
      var li=b.closest('[data-fid]'),arr=state[li.dataset.fk];
      for(var k=0;k<arr.length;k++){if(arr[k].id===li.dataset.fid){arr[k].done=true;break}}
      commit();return;
    }
    if(e.target.closest('[data-tab]'))toggleFloat(false);
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&floatOpen){toggleFloat(false);fab.focus()}});
  window.addEventListener('resize',place);

  /* ---------- Avisos automáticos ---------- */
  var AKEY='mis-pendientes-aviso',every=30,lastAlert=0,seen={};
  try{var av=localStorage.getItem(AKEY);if(av!==null&&!isNaN(+av))every=+av}catch(e){}
  var sel=$('#fl-every');sel.value=String(every);
  sel.addEventListener('change',function(){every=+sel.value;try{localStorage.setItem(AKEY,String(every))}catch(e){}lastAlert=Date.now()});
  function dueAt(r){return new Date(r.date+'T'+(r.time||'08:00'))}
  function pendingCount(){
    var g=remGroups().g;
    return g.venc.length+g.hoy.length+state.tasks.filter(function(t){return !t.done}).length;
  }
  function alertNow(){
    if(!pendingCount())return;
    lastAlert=Date.now();renderFloat();toggleFloat(true);
    try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
  }
  function checkAlerts(){
    var now=new Date(),fresh=false;
    state.rem.forEach(function(r){
      if(!r.done&&r.date&&!seen[r.id]&&dueAt(r)<=now){seen[r.id]=1;fresh=true}
    });
    if(fresh){alertNow();return}
    if(every>0&&Date.now()-lastAlert>=every*60000)alertNow();
  }
  function initAlerts(){
    var now=new Date();
    state.rem.forEach(function(r){if(r.date&&dueAt(r)<=now)seen[r.id]=1});
    alertNow();
  }
  place();

  $('#s-cat').innerHTML=CATS.map(function(c){return '<option>'+esc(c)+'</option>'}).join('');
  show(location.hash.slice(1));
  render();
  syncNative();
  setInterval(function(){renderHome();renderRem();renderHead();renderFloat();checkAlerts()},30000);

  /* Pantalla de inicio: logo animado, "By Vincent Calavera"; se cierra sola o al tocarla */
  try{$('#logo-sm').src=$('#logo-big').src}catch(e){}
  var splash=$('#splash'),started=false;
  function hideSplash(){
    splash.classList.add('out');
    if(!started){started=true;setTimeout(initAlerts,500)}
  }
  splash.addEventListener('click',hideSplash);
  setTimeout(hideSplash,2900);
})();
</script>
</body>
</html>
